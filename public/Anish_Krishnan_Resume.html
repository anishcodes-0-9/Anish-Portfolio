<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anish Krishnan — Resume</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 50px 60px;

        border-radius: 14px;

        max-width: 650px;
        width: 100%;

        text-align: center;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 16px;
        color: #555;
        margin-bottom: 35px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 18px;
      }

      .btn {
        display: inline-block;

        padding: 12px 22px;

        border-radius: 8px;

        font-size: 15px;
        font-weight: 500;

        text-decoration: none;

        transition: all 0.2s ease;
      }

      .view {
        background: #1a73e8;
        color: white;
      }

      .download {
        background: #333;
        color: white;
      }

      .btn:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Anish Krishnan</h1>

      <p class="subtitle">
        Software Engineer — Distributed Systems & Full Stack
      </p>

      <div class="buttons">
        <a
          class="btn view"
          href="/Anish_Krishnan_Resume.pdf"
          target="_blank"
          rel="noopener"
        >
          View Resume
        </a>

        <a
          class="btn download"
          href="/Anish_Krishnan_Resume.pdf"
          download="Anish_Krishnan_Resume.pdf"
        >
          Download Resume
        </a>
      </div>
    </div>
  </body>
</html>
